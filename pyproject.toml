[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptshield"
version = "0.1.0"
description = "LLM prompt-injection firewall: an OpenAI-compatible proxy that blocks injection and data-leak attempts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "joblib>=1.3"]
eval = ["pyarrow>=15"]
dev = ["pytest>=8", "scikit-learn>=1.4", "joblib>=1.3", "pyarrow>=15"]

[project.scripts]
promptshield = "promptshield.cli:main"

[tool.setuptools.packages.find]
include = ["promptshield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
